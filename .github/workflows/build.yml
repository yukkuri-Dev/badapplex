name: Build

on:
  push:
    branches: '*'
    tags: '*'
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: 'Tag Name to be created'

jobs:
  build:
    name: Build EX-word addon
    runs-on: ubuntu-latest
    # デフォルトのGITHUB_TOKENはリポジトリ設定次第でread-onlyになっており、
    # それだと `gh release create` が 403 (Resource not accessible by
    # integration) で失敗する。Release作成に必要な書き込み権限をここで
    # 明示的に付与する。
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: |
          cd ..
          curl -sSfL https://github.com/MaxSignal/buildscripts/releases/download/Linux/devkitPro.tar.gz | tar -zxf -
          cd -
          DEVKITPRO="$OLDPWD/devkitPro" DEVKITSH4="$DEVKITPRO/devkitSH4" PATH="$DEVKITPRO/tools/bin:$DEVKITSH4/bin:$PATH" make
          zip -r build.zip build

      # タグpush/手動発行はそのタグ名で、通常のブランチpush(タグ無し)は
      # 短いcommit hash (例: build-a1b2c3d) をタグ名代わりにしてReleaseを作る。
      - name: Publish
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            release_tag="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            release_tag="${GITHUB_REF/refs\/*s\//}"
          else
            release_tag="build-$(git rev-parse --short HEAD)"
          fi
          gh release create "$release_tag" -t "$release_tag" -n "Automatic build of $(git rev-parse HEAD)." ./build.zip
